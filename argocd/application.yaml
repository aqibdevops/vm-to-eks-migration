apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: migration-platform, namespace: argocd}
spec:
  project: default
  source:
    repoURL: https://github.com/example/vm-to-eks-migration.git
    targetRevision: main
    path: helm/migration-platform
  destination:
    server: https://kubernetes.default.svc
    namespace: migration-demo
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
