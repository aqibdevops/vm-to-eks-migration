apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: migration-target, namespace: migration-demo}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: migration-target}
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
